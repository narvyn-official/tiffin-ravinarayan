server {
    server_name tiffin.ravinarayan.in www.tiffin.ravinarayan.in;

    client_max_body_size 8M;

    # Reverse-proxy everything to gunicorn over a unix socket
    location / {
        proxy_pass http://unix:/var/www/tiffin_ravinarayan/tiffin.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Listen for HTTP; certbot --nginx will add 443/SSL block + 80 redirect
    listen 80;
}
